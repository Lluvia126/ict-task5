# 云主机一键部署： Ne04j + 后端 + (可选)AI 服务 + Cloudflare 隧道
#   启动：  docker compose up -d
#   含 AI： docker compose --profile ai up -d
#   日志：  docker compose logs -f backend
# 对外只有 Cloudflare 隧道（出站连接），宿主机不需要开放 8000/7474 任何入站端口。
services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
      # 小内存机器（2G）必须限制堆，否则会被 OOM kill
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  backend:
    build: .
    image: ict-task5-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内要用服务名访问 Neo4j（覆盖 .env 里的 localhost）
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8001}
    volumes:
      - ./data:/app/data     # SQLite（results.db / pairs.db）与上传文件，持久化
      - ./logs:/app/logs     # 访问留痕 access.log
    depends_on:
      neo4j:
        condition: service_healthy

  ai:
    # 同机部署 AI 抽取服务时才需要：docker compose --profile ai up -d
    build: .
    image: ict-task5-backend:latest
    restart: unless-stopped
    profiles: ["ai"]
    command: ["python", "-m", "uvicorn", "ai_extraction.api:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file:
      - .env

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # TUNNEL_TOKEN 在 Cloudflare Zero Trust 后台创建隧道后获得
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - backend

volumes:
  neo4j-data: